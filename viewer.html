<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>winless</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#14161a; --fg:#d9dde3; --dim:#7d8590; --bar:#232831; --mark:#5b4a00; --hl:#274a73;
          --cur:#b3541e; --curfg:#fff; --sel:#2f5d8a; --vcur:#e0b050; --padb:0px; --font:"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace; --size:17px; }
  :root.light { --bg:#fbfaf6; --fg:#22252a; --dim:#7a7468; --bar:#e8e3d6; --mark:#fff0a8; --hl:#cfe3ff;
          --cur:#ffb27a; --curfg:#000; --sel:#b7d4f5; --vcur:#e0a020; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; }
  #view { position:absolute; left:0; right:0; top:0; bottom:calc(var(--barh,28px) + var(--padb,0px)); overflow:hidden; padding:2px 10px;
          font:var(--size)/1.38 var(--font); box-sizing:border-box; }
  .line { white-space:pre-wrap; overflow-wrap:anywhere; unicode-bidi:plaintext; min-height:1.38em; }
  .chop .line { white-space:pre; overflow:hidden; text-overflow:clip; }
  .ln { position:sticky; left:0; z-index:1; background:var(--bg); display:inline-block; min-width:var(--lnw,4ch); margin-right:1.2ch; color:var(--dim); text-align:right;
        unicode-bidi:isolate; user-select:none; }
  .mk { background:var(--mark); }
  .hit { background:var(--hl); border-radius:2px; }
  .cur { background:var(--cur); color:var(--curfg); border-radius:2px; }
  .sel { background:var(--sel); }
  .vcur { background:var(--vcur); color:#000; box-shadow:0 2px 0 var(--vcur), 0 -1px 0 var(--vcur); }   /* a steady block, as tall as the row */
  .selrow { background:var(--sel); }
  #panel { display:none; position:absolute; left:0; right:0; bottom:var(--barh,28px); background:var(--bar); padding:6px 10px;
           box-sizing:border-box; border-top:1px solid var(--dim); }
  #panel .title { color:var(--dim); font:12px var(--font); height:18px; }
  #panel textarea { width:100%; height:calc(100% - 20px); background:var(--bg); color:var(--fg); border:1px solid var(--dim);
                    font:var(--size)/1.38 var(--font); resize:none; box-sizing:border-box; outline:0; }
  #bar .mode { color:#e0b050; font-weight:bold; }
  #measure { position:absolute; visibility:hidden; left:0; right:0; top:0; height:auto; overflow:visible; padding:2px 10px;
             font:var(--size)/1.38 var(--font); box-sizing:border-box; pointer-events:none; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:var(--barh,28px); background:var(--bar); color:var(--fg);
         font:14px/28px var(--font); padding:0 10px; box-sizing:border-box; display:flex; gap:16px; white-space:nowrap;
         overflow:hidden; }
  #bar .name { color:var(--dim); overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; }
  #bar .pos { flex:1 1 auto; }
  #bar .srch { color:var(--dim); }
  #bar .end { color:#e0b050; }
  #prompt { display:none; flex:1; }
  #prompt input { background:transparent; border:0; outline:0; color:var(--fg); font:14px var(--font); width:calc(100% - 2ch); }
  #help { display:none; position:absolute; inset:0 0 var(--barh,28px) 0; background:var(--bg); padding:18px 28px;
          font:15px/1.5 var(--font); overflow:auto; }
  #help b { color:#e0b050; } #help td { padding:1px 18px 1px 0; vertical-align:top; }
  #flash { position:absolute; right:14px; top:8px; background:var(--bar); color:var(--fg); padding:4px 10px;
           border-radius:4px; font:13px var(--font); opacity:0; transition:opacity .25s; pointer-events:none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="measure"></div>
<div id="help"></div>
<div id="flash"></div>
<div id="panel"><div class="title" id="ptitle"></div><textarea id="ptxt" spellcheck="false"></textarea></div>
<div id="bar"><span class="mode" id="bmode"></span><span class="name" id="bname"></span><span class="pos" id="bpos"></span><span class="srch" id="bsrch"></span>
  <span id="prompt"><span id="pch">/</span><input id="pin" autocomplete="off" spellcheck="false"></span></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const view = $("view"), measure = $("measure");
const S = { lines: [], name: "", top: 0, bottom: 0, numbers: false, wrap: true, hx: 0, off: 0, vis: null, reg: null, last: null, pend: null, op: null, panel: null, cur: { r: 0, c: 0 }, goalX: null, keeping: false, count: 0, opN: 1, nl: true, redo: 0, dirty: false, undo: 0, path: null,
            search: null, searchBack: false, matchLines: [], curLine: -1, marks: [], hls: [], prompt: null, atEnd: false };
let sentTimer = null, closedSent = false;

/* ---------- helpers ---------- */
function flash(msg) { const f = $("flash"); f.textContent = msg; f.style.opacity = 1; clearTimeout(f._t); f._t = setTimeout(() => f.style.opacity = 0, 1400); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function total() { return S.lines.length; }
function lnWidth() { return Math.max(4, String(total()).length + 1) + "ch"; }
function smartcase(p) { return /[A-Z]/.test(p) ? "g" : "gi"; }
function makeRe(p) { try { return new RegExp(p, smartcase(p)); } catch (e) { return new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), smartcase(p)); } }
function colorVar(c) { return { yellow:"#7a6a00", red:"#7a2a2a", green:"#245a2a", blue:"#274a73", purple:"#55307a", orange:"#8a4a10" }[c] || c || ""; }

/* ---------- line rendering ---------- */
function lineNode(i) {
  const d = document.createElement("div"); d.className = "line"; d.dir = "auto"; d.dataset.i = i;
  const text = S.lines[i];
  if (selectedRow(i)) d.classList.add("selrow");
  if (S.numbers) { const n = document.createElement("span"); n.className = "ln"; n.textContent = i + 1; d.appendChild(n); }
  const ranges = [];
  const add = (re, cls) => { re.lastIndex = 0; let m; while ((m = re.exec(text)) && m[0] !== "") { ranges.push([m.index, m.index + m[0].length, cls]); if (re.lastIndex === m.index) re.lastIndex++; } };
  for (const h of S.hls) add(h.re, "hl:" + (h.color || ""));
  if (S.search) add(S.search.re, i === S.curLine ? "cur" : "hit");
  { const vr = visRangesFor(i), cr = vr.find(r => r[2] === "vcur");       // the cursor block always shows: split other highlights around it
    for (const r of vr) if (r[2] !== "vcur") ranges.push(r);
    if (cr) {
      const out = [];
      for (const r of ranges) {
        if (r[1] <= cr[0] || r[0] >= cr[1]) out.push(r);
        else { if (r[0] < cr[0]) out.push([r[0], cr[0], r[2]]); if (r[1] > cr[1]) out.push([cr[1], r[1], r[2]]); }
      }
      ranges.length = 0; for (const r of out) ranges.push(r); ranges.push(cr);
    } }
  ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  let pos = 0;
  const put = (s, e, cls) => {
    if (e <= s) return; const t = text.slice(s, e);
    if (!cls) { d.appendChild(document.createTextNode(t)); return; }
    const sp = document.createElement("span");
    if (cls.startsWith("hl:")) { sp.style.background = colorVar(cls.slice(3)) || "var(--hl)"; sp.style.borderRadius = "2px"; } else sp.className = cls;
    sp.textContent = t; d.appendChild(sp);
  };
  for (const r of ranges) { if (r[0] < pos) continue; put(pos, r[0], null); put(r[0], r[1], r[2]); pos = r[1]; }
  put(pos, text.length, null);
  if (!text) {
    if (i === S.cur.r) { const sp = document.createElement("span"); sp.className = "vcur"; sp.textContent = "\u00a0"; d.appendChild(sp); }
    else d.appendChild(document.createTextNode("\u200b"));
  }
  for (const m of S.marks) if (i + 1 >= m.a && i + 1 <= m.b) { d.classList.add("mk"); if (m.color) d.style.background = colorVar(m.color); }
  return d;
}

function fitFrom(top) {              // render forward from `top`; returns index of last fully visible line
  view.textContent = ""; view.classList.toggle("chop", !S.wrap);
  const H = view.clientHeight - 4; let last = top - 1;
  for (let i = top; i < total(); i += 40) {
    const frag = document.createDocumentFragment(); const end = Math.min(total(), i + 40);
    for (let k = i; k < end; k++) frag.appendChild(lineNode(k));
    view.appendChild(frag);
    if (i === top && S.off) view.firstChild.style.marginTop = -S.off + "px";   // scrolled part-way into a tall line
    const kids = view.children; let cut = -1;
    for (let k = 0; k < kids.length; k++) { if (kids[k].offsetTop - view.offsetTop + kids[k].offsetHeight > H + 2) { cut = k; break; } }
    if (cut >= 0) { while (view.children.length > cut + 1) view.removeChild(view.lastChild); break; }   // keep the crossing line, clipped
  }
  last = top + view.children.length - 1;
  return last;
}

function topForBottom(endIdx) {      // smallest top such that lines top..endIdx fit the screen
  measure.className = S.wrap ? "" : "chop"; measure.textContent = ""; const H = view.clientHeight - 4;
  let top = endIdx + 1;
  for (let i = endIdx; i >= 0; i--) {
    measure.insertBefore(lineNode(i), measure.firstChild);
    if (measure.offsetHeight - 4 > H && top <= endIdx) break;
    top = i;
  }
  measure.textContent = "";
  return top;
}

function render() {
  S.top = clamp(S.top, 0, Math.max(0, total() - 1));
  S.bottom = total() ? fitFrom(S.top) : -1;
  { const f0 = view.firstElementChild;
    if (f0 && S.off >= f0.offsetHeight - 0.5) { S.off = 0; S.bottom = fitFrom(S.top); } }   // e.g. after a resize
  if (pullCursor()) S.bottom = fitFrom(S.top);
  const E = endPos(); S.atEnd = S.top > E.top || (S.top === E.top && S.off >= E.off - 0.5);
  applyHx();
  const n = total(), shown = S.bottom - S.top + 1;
  $("bname").textContent = (S.name || "(no file)") + (S.dirty ? " [+]" : "");
  $("bpos").innerHTML = "";
  const pos = $("bpos");
  if (!n) pos.textContent = "(empty)";
  else {
    const pct = Math.round(100 * (S.bottom + 1) / n);
    pos.textContent = `lines ${S.top + 1}-${S.bottom + 1} of ${n} (${pct}%)`;
    if (S.atEnd) { const e = document.createElement("span"); e.className = "end"; e.textContent = "  (END)"; pos.appendChild(e); }
  }
  $("bsrch").textContent = S.search ? `/${S.search.src}  ${S.matchLines.length} line${S.matchLines.length === 1 ? "" : "s"}` : "";
  scheduleState();
}

/* ---------- horizontal scroll (chop mode) ---------- */
function applyHx() { for (const d of view.children) d.scrollLeft = S.wrap ? 0 : S.hx; }
function hscroll(dir) {
  if (S.wrap) { flash("lines are wrapped; press w to chop, then h / l scroll sideways"); return; }
  const step = Math.round(8 * 0.6 * parseFloat(getComputedStyle(view).fontSize));
  S.hx = dir === 0 ? 0 : Math.max(0, S.hx + dir * step); applyHx();
}

/* ---------- movement ---------- */
/* Scrolling is by screen rows, as in less: a logical line that wraps over several rows is walked through row by row.
   The position is (S.top = logical line, S.off = pixels scrolled into it). */
function vh() { return view.clientHeight - 4; }
function rowH() {                    // height of one screen row of text
  measure.className = S.wrap ? "" : "chop"; measure.textContent = "";
  const d = document.createElement("div"); d.className = "line"; d.textContent = "x"; measure.appendChild(d);
  const h = d.getBoundingClientRect().height; measure.textContent = ""; return h || 20;
}
function lineH(i) {                  // rendered height of logical line i
  measure.className = S.wrap ? "" : "chop"; measure.textContent = "";
  const d = lineNode(i); measure.appendChild(d); const h = d.getBoundingClientRect().height; measure.textContent = ""; return h;
}
function endPos() {                  // the position that puts the last row of the file at the bottom of the window
  const H = vh(); measure.className = S.wrap ? "" : "chop"; measure.textContent = "";
  for (let i = total() - 1; i >= 0; i--) {
    measure.insertBefore(lineNode(i), measure.firstChild);
    const h = measure.getBoundingClientRect().height - 4;
    if (h >= H - 0.5) { measure.textContent = ""; return { top: i, off: Math.max(0, h - H) }; }
  }
  measure.textContent = ""; return { top: 0, off: 0 };
}
function scrollBy(px) {              // move the window by px pixels (positive = down) through real screen rows
  const E = endPos(); let top = S.top, off = S.off;
  if (px > 0) {
    let rem = px;
    while (rem > 0.5 && top < total()) {
      const h = lineH(top);
      if (off + rem < h - 0.5) { off += rem; rem = 0; } else { rem -= (h - off); off = 0; top++; }
      if (top > E.top || (top === E.top && off >= E.off)) { top = E.top; off = E.off; break; }
    }
  } else {
    let rem = -px;
    if (off >= rem - 0.5) { off = Math.max(0, off - rem); rem = 0; } else { rem -= off; off = 0; }
    while (rem > 0.5 && top > 0) { top--; const h = lineH(top); if (rem <= h + 0.5) { off = Math.max(0, h - rem); rem = 0; } else rem -= h; }
  }
  S.top = clamp(top, 0, Math.max(0, total() - 1)); S.off = off < 0.5 ? 0 : off; render();
}
function pageRows(frac) { return Math.max(1, Math.round(Math.max(1, Math.floor(vh() / rowH())) * frac)) * rowH(); }
function lineDown(n = 1) { if (S.atEnd) { flash("(END)"); return; } scrollBy(n * rowH()); }
function lineUp(n = 1) { if (S.top === 0 && S.off === 0) return; scrollBy(-n * rowH()); }
function pageDown(frac = 1) { if (S.atEnd) { flash("(END)"); return; } scrollBy(pageRows(frac)); }
function pageUp(frac = 1) { if (S.top === 0 && S.off === 0) { flash("(TOP)"); return; } scrollBy(-pageRows(frac)); }
function gotoLine(n) { S.top = clamp(n - 1, 0, Math.max(0, total() - 1)); S.off = 0; render(); }
function gotoTop() { S.top = 0; S.off = 0; render(); }
function gotoBottom() { const E = endPos(); S.top = E.top; S.off = E.off; render(); }
function gotoPercent(p) { S.top = clamp(Math.floor(total() * p / 100), 0, Math.max(0, total() - 1)); S.off = 0; render(); }

/* ---------- search ---------- */
function doSearch(pattern, back = false, quiet = false) {
  if (pattern === "" || pattern == null) { S.search = null; S.matchLines = []; S.curLine = -1; render(); return; }
  const re = makeRe(pattern); S.search = { src: pattern, re }; S.searchBack = back;
  S.matchLines = []; const probe = new RegExp(re.source, re.flags.replace("g", ""));
  for (let i = 0; i < total(); i++) if (probe.test(S.lines[i])) S.matchLines.push(i);
  S.curLine = -1; stepMatch(back ? -1 : 1, true, quiet);
}
function stepMatch(dir, first = false, quiet = false) {
  if (!S.search || !S.matchLines.length) { if (!quiet) flash(S.search ? "Pattern not found" : "No previous search"); render(); return false; }
  const ref = first ? (dir > 0 ? S.top - 1 : S.top + 1) : (S.curLine >= 0 ? S.curLine : S.top);
  let next = -1;
  if (dir > 0) { next = S.matchLines.find(i => i > ref); if (next === undefined) next = -1; }
  else { for (let k = S.matchLines.length - 1; k >= 0; k--) if (S.matchLines[k] < ref) { next = S.matchLines[k]; break; } }
  if (next < 0) {                    // wrapscan, as in vim: continue from the other end
    next = dir > 0 ? S.matchLines[0] : S.matchLines[S.matchLines.length - 1];
    if (!quiet) flash(dir > 0 ? "search hit BOTTOM, continuing at TOP" : "search hit TOP, continuing at BOTTOM");
  }
  S.curLine = next; S.top = next; S.off = 0;
  { const text = S.lines[next] || "", probe = new RegExp(S.search.re.source, S.search.re.flags.replace("g", "")), m = probe.exec(text);
    S.cur = { r: next, c: m ? Array.from(text.slice(0, m.index)).length : 0 }; S.goalX = null; }
  render(); return true;
}

/* ---------- prompt ---------- */
function openPrompt(ch, prefill) { S.prompt = ch; $("pch").textContent = ch; $("prompt").style.display = "flex"; $("bname").style.display = "none"; $("bpos").style.display = "none"; $("bsrch").style.display = "none"; const i = $("pin"); i.value = prefill || ""; i.focus(); }
function closePrompt() { S.prompt = null; $("prompt").style.display = "none"; for (const id of ["bname", "bpos", "bsrch"]) $(id).style.display = ""; $("pin").blur(); document.body.focus(); }
$("pin").addEventListener("keydown", e => {
  if (e.key === "Escape") { closePrompt(); e.preventDefault(); }
  else if (e.key === "Enter") { const v = $("pin").value, ch = S.prompt; closePrompt(); runPrompt(ch, v); e.preventDefault(); }
  e.stopPropagation();
});
function runPrompt(ch, v) {
  if (ch === "/") { if (S.vis) visSearch(v); else doSearch(v, false); } else if (ch === "?") doSearch(v, true);
  else if (ch === ":") {
    v = v.trim(); let m;
    if ((m = /^([%*.$0-9,'<>]*)s([^\w\s\\"|].*)$/.exec(v))) { substitute(m[1], m[2][0], m[2].slice(1)); return; }
    if (v === "q" || v === "quit") tryQuit(false); else if (v === "q!") tryQuit(true);
    else if (v === "w") writeFile(false); else if (v === "w!") writeFile(true);
    else if (v === "history") showHistory(); else if ((m = /^revert(!?)(?:\s+(\d+))?$/.exec(v))) revertFile(m[2] ? +m[2] : 0, !!m[1]);
    else if (v === "wq" || v === "x") writeFile(false).then(ok => { if (ok) quit(); });
    else if ((m = v.match(/^(\d+)$/))) gotoLine(+m[1]);
    else if ((m = v.match(/^(\d+)%$/))) gotoPercent(+m[1]);
    else if (v === "help" || v === "h") toggleHelp(true);
    else if (v === "set numbers" || v === "N") toggleNumbers(); else if (v === "set wrap") toggleWrap(); else flash("Unknown command: " + v);
  }
}

/* ---------- cursor, visual mode and editing ---------- */
/* Positions are [row, col]: row = logical line from 0, col = code point from 0.  The cursor S.cur is always drawn as a
   block (it never blinks).  Visual mode is an anchor S.vis = { mode, ar, ac } plus the cursor.  The server wants rows from 1,
   columns from 1 and an end that is excluded (see rangeOf). */
const cpCache = new Map();
function lcp(i) { let a = cpCache.get(i); const t = S.lines[i] || ""; if (!a || a.s !== t) { a = Array.from(t); a.s = t; cpCache.set(i, a); } return a; }
const WORDCH = /[\p{L}\p{N}_]/u, SPACECH = /\s/;
function cls(ch) { return ch === undefined ? 0 : SPACECH.test(ch) ? 1 : WORDCH.test(ch) ? 2 : 3; }
function cmpPos(a, b) { return a[0] - b[0] || a[1] - b[1]; }

function setMode() {
  const pend = (S.count || "") + (S.op || "") + (S.pend || "");
  $("bmode").textContent = S.vis ? (S.vis.mode === "V" ? "-- VISUAL LINE --" : "-- VISUAL --") + (S.count ? " " + S.count : "") : pend ? pend + " …" : "";
}
function visRange() {
  let a = [S.vis.ar, S.vis.ac], h = [S.cur.r, S.cur.c];
  if (cmpPos(a, h) > 0) [a, h] = [h, a];
  return { sr: a[0], sc: a[1], er: h[0], ec: h[1] };
}
function visRangesFor(i) {           // [start, end, class] in UTF-16 units of line i: the selection, with the cursor block drawn over it
  const u0 = a => k => a.slice(0, k).join("").length;
  const a = lcp(i), n = a.length, u = u0(a), cur = (i === S.cur.r && n) ? Math.min(S.cur.c, n - 1) : -1;
  if (!S.vis) return cur >= 0 ? [[u(cur), u(cur + 1), "vcur"]] : [];
  const R = visRange(); if (i < R.sr || i > R.er) return cur >= 0 ? [[u(cur), u(cur + 1), "vcur"]] : [];
  let s = 0, e = n;
  if (S.vis.mode === "v") { if (i === R.sr) s = R.sc; if (i === R.er) e = R.ec + 1; }
  s = Math.min(s, n); e = Math.min(e, n);
  const out = [];
  if (cur >= s && cur < e) { if (cur > s) out.push([u(s), u(cur), "sel"]); out.push([u(cur), u(cur + 1), "vcur"]); if (cur + 1 < e) out.push([u(cur + 1), u(e), "sel"]); }
  else { if (e > s) out.push([u(s), u(e), "sel"]); if (cur >= 0) out.push([u(cur), u(cur + 1), "vcur"]); }
  return out;
}
function selectedRow(i) {            // is line i inside the selection as a whole row (line mode, or an empty line)?
  if (!S.vis) return false; const R = visRange();
  return i >= R.sr && i <= R.er && (S.vis.mode === "V" || (S.lines[i] || "") === "");
}

function setCursor(r, c, keepGoal) {
  r = clamp(r, 0, Math.max(0, total() - 1));
  S.cur = { r, c: clamp(c, 0, Math.max(0, lcp(r).length - 1)) };
  if (!keepGoal) S.goalX = null;
  render(); keepCursorVisible();
}
function keepCursorVisible() {       // scroll so the cursor is on screen, including inside a paragraph taller than the window
  S.keeping = true;
  try {
    if (S.cur.r < S.top || S.cur.r > S.bottom) { S.top = S.cur.r; S.off = 0; render(); }
    const el = view.querySelector(".vcur");
    if (el) {
      const vr = view.getBoundingClientRect(), r = el.getBoundingClientRect(), m = rowH() * 2;
      if (r.bottom > vr.bottom - 2) scrollBy(r.bottom - vr.bottom + m); else if (r.top < vr.top + 2) scrollBy(r.top - vr.top - m);
    }
  } finally { S.keeping = false; }
}
function pullCursor() {              // the view scrolled by itself: keep the cursor on a line that is showing
  if (S.keeping || !total()) return false;
  let r = S.cur.r;
  if (r < S.top) r = S.top; else if (r > S.bottom) r = S.bottom > S.top ? S.bottom - 1 : S.bottom;
  if (r === S.cur.r) return false;
  S.cur = { r, c: 0 }; S.goalX = null; return true;
}

/* moving by screen row: use the layout itself, so a wrapped paragraph is walked row by row */
function caretAt(x, y) {
  let node, off;
  if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); if (!p) return null; node = p.offsetNode; off = p.offset; }
  else if (document.caretRangeFromPoint) { const p = document.caretRangeFromPoint(x, y); if (!p) return null; node = p.startContainer; off = p.startOffset; }
  else return null;
  return domPos(node, off);
}
function moveRow(dir) {
  keepCursorVisible();

/* the bottom panel: a larger text box for changes */
function openPanel(title, text, onCommit) {
  S.panel = { onCommit }; $("ptitle").textContent = title; $("ptxt").value = text;
  const h = Math.round(innerHeight * 0.3);
  $("panel").style.display = "block"; $("panel").style.height = h + "px"; document.documentElement.style.setProperty("--padb", h + "px");
  render(); $("ptxt").focus(); $("ptxt").setSelectionRange(text.length, text.length);

function closePanel() { S.panel = null; $("panel").style.display = "none"; document.documentElement.style.setProperty("--padb", "0px"); document.body.focus(); render(); keepCursorVisible(); }
$("ptxt").addEventListener("keydown", e => {
  if (e.key === "Escape") { closePanel(); e.preventDefault(); }
  else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { const f = S.panel.onCommit, t = $("ptxt").value; closePanel(); f(t); e.preventDefault(); }
  e.stopPropagation();
});

/* the mouse: a click puts the cursor there; dragging over text starts a visual selection */
function domPos(node, offset) {

  const ln = el.querySelector(".ln"), units = Math.max(0, rg.toString().length - (ln ? ln.textContent.length : 0));
  const r = +el.dataset.i, text = S.lines[r] || "";

}
document.addEventListener("mouseup", e => {
  if (S.prompt || S.panel || e.target.closest && e.target.closest("#bar, #panel, #help")) return;
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.anchorNode) {                               // a plain click
    const p = caretAt(e.clientX, e.clientY); if (p) setCursor(p.r, p.c);
    return;

  if (fwd) { if (hc === 0 && hr > ar) { hr--; hc = Math.max(0, lcp(hr).length - 1); } else hc = Math.max(0, hc - 1); }
  else { ac = Math.max(0, ac - 1); }
  S.vis = { mode: "v", ar, ac: Math.min(ac, Math.max(0, lcp(ar).length - 1)) };
  S.op = null; S.pend = null; setMode();
  setCursor(hr, Math.min(hc, Math.max(0, lcp(hr).length - 1)));
});

/* ---------- toggles / misc ---------- */
function toggleNumbers() { S.numbers = !S.numbers; S.off = 0; view.style.setProperty("--lnw", lnWidth()); measure.style.setProperty("--lnw", lnWidth()); render(); flash("line numbers " + (S.numbers ? "on" : "off")); }

function setFont(family, size) { S.off = 0; const r = document.documentElement.style; if (family) r.setProperty("--font", family); if (size) r.setProperty("--size", size + "px"); render(); }

const HELP = `<h3>winless &mdash; keys (vim, with less for scrolling)</h3><table>
<tr><td><b>h j k l</b> &larr;&darr;&uarr;&rarr;</td><td>move the cursor (j and k by screen row); the cursor is always shown as a block</td></tr>
<tr><td><b>w b e</b> / <b>0 $</b> / <b>( )</b> / <b>{ }</b> / <b>gg G</b></td><td>word / line / sentence / paragraph (a line) / file motions</td></tr>
<tr><td><b>Space</b> PgDn / PgUp</td><td>page down / up (the cursor follows); <b>Ctrl-f Ctrl-b</b> page, <b>Ctrl-d Ctrl-u</b> half page, <b>Ctrl-e Ctrl-y</b> line</td></tr>
<tr><td><b>/</b>pat <b>?</b>pat <b>n</b> <b>N</b></td><td>search (smart-case regex); n and N wrap around; the cursor lands on the match</td></tr>
<tr><td><b>:</b>123 <b>:</b>50%</td><td>go to line / percent</td></tr>
<tr><td><b>-N</b> or <b>#</b> / <b>-S</b></td><td>toggle line numbers / wrap and chop; <b>zh zl z0</b> scroll sideways when chopped</td></tr>
<tr><td><b>t</b> / ctrl +&minus;</td><td>dark / light; font size</td></tr>
<tr><td><b>F1</b> or <b>:</b>help &nbsp; <b>q</b></td><td>this help; quit (refuses with unsaved changes)</td></tr></table>
<h3>selecting and editing</h3><table>
<tr><td><b>v</b> / <b>V</b> / drag</td><td>start a character / line selection at the cursor; the mouse works too; a click puts the cursor</td></tr>
<tr><td>in visual mode</td><td>every motion above extends the selection; <b>o</b> swaps its ends; <b>Esc</b> leaves; <b>gv</b> reselects</td></tr>
<tr><td><b>y</b> <b>d</b> <b>c</b> <b>p</b></td><td>yank, delete, change (opens the bottom panel; Ctrl-Enter applies, Esc cancels), replace with the register</td></tr>
<tr><td><b>d c y</b> + motion or object</td><td><b>dw cw y$ dd cc yy</b>, and <b>iw aw is as ip</b> objects: <b>ciw cis dip</b>; also <b>x D C Y</b></td></tr>
<tr><td><b>i a I A o O</b></td><td>type new text in the bottom panel (before / after the cursor, at the start / end of the line, on a new line below / above); Ctrl-Enter inserts, Esc cancels</td></tr>
<tr><td><b>r</b>x &nbsp; <b>J</b> &nbsp; <b>x</b></td><td>replace the character; join with the next line; delete the character</td></tr>
<tr><td><b>3j 2w 3x 2dd d2w 5G</b></td><td>counts work as in vim</td></tr>
<tr><td><b>p</b> / <b>u</b> / <b>Ctrl-r</b></td><td>paste after the cursor / undo (half page up when there is nothing to undo) / redo</td></tr>
<tr><td><b>:s/a/b/g</b> <b>:%s/a/b/</b> <b>:2,5s/a/b/</b></td><td>substitute (JavaScript regex; &amp; and \\1 in the replacement); ranges % . $ N,M; from visual mode <b>:</b> offers '&lt;,'&gt;, and '&lt;&gt; means exactly the selection</td></tr>
<tr><td><b>:w</b> <b>:w!</b> <b>:q</b> <b>:q!</b> <b>:wq</b></td><td>write the file (the bar shows [+] while there are unsaved changes)</td></tr></table>
<p>Press any key to close this help.</p>`;
function toggleHelp(on) { const h = $("help"); h.innerHTML = HELP; h.style.display = on ? "block" : "none"; }

/* ---------- keyboard ---------- */
let pendingDash = false;
function handleKey(k, e) {
  if ($("help").style.display === "block") { toggleHelp(false); return true; }
  if (pendingDash) { pendingDash = false; if (k === "N") { toggleNumbers(); return true; } if (k === "S") { toggleWrap(); return true; } }
  if (S.panel) { if (k === "Escape") closePanel(); return true; }
  if (S.vis) return visKey(k);
  if (normKey(k)) return true;
  switch (k) {
    case " ": case "PageDown": pageDown(); break;
    case "PageUp": pageUp(); break;
    case "/": openPrompt("/"); break; case "?": openPrompt("?"); break; case ":": openPrompt(":"); break;
    case "n": stepMatch(S.searchBack ? -1 : 1); break; case "N": stepMatch(S.searchBack ? 1 : -1); break;
    case "-": pendingDash = true; break; case "#": toggleNumbers(); break;
    case "t": toggleTheme(); break; case "F1": toggleHelp(true); break; case "q": tryQuit(false); break;
    default: return false;
  }
  return true;
}
document.addEventListener("keydown", e => {
  if (S.prompt || S.panel) return;
  if ((e.ctrlKey || e.metaKey) && (e.key === "+" || e.key === "=")) { setFont(null, parseInt(getComputedStyle(document.documentElement).getPropertyValue("--size")) + 1); e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === "-") { setFont(null, parseInt(getComputedStyle(document.documentElement).getPropertyValue("--size")) - 1); e.preventDefault(); return; }
  if (e.ctrlKey && !e.metaKey && !e.altKey && $("help").style.display !== "block") {   // vim scroll chords
    const c = { d: () => pageDown(0.5), u: () => pageUp(0.5), f: () => pageDown(), b: () => pageUp(), e: () => lineDown(), y: () => lineUp(), r: () => redoEdit() }[e.key];
    if (c) { c(); e.preventDefault(); return; }
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (handleKey(e.key, e)) e.preventDefault();
});
document.addEventListener("wheel", e => { if (S.prompt || S.panel) return; const n = Math.sign(e.deltaY) * 3; if (n > 0) lineDown(n); else lineUp(-n); e.preventDefault(); }, { passive: false });
window.addEventListener("resize", () => render());

/* ---------- server link ---------- */
window.addEventListener("error", e => { S.err = e.message + " @" + e.lineno + ":" + e.colno; try { scheduleState(); } catch (x) {} });
function post(obj) { try { return fetch("/event", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(obj) }); } catch (e) {} }
function scheduleState() { clearTimeout(sentTimer); sentTimer = setTimeout(sendState, 120); }
function geom() {                   // where things actually are on screen (for diagnosing layout)
  const r = id => { const b = $(id).getBoundingClientRect(); return [Math.round(b.left), Math.round(b.top), Math.round(b.width), Math.round(b.height)]; };
  const c = view.querySelector(".vcur"), cb = c ? c.getBoundingClientRect() : null;
  return { inner: [innerWidth, innerHeight], view: r("view"), bar: r("bar"), panel: r("panel"), panelDisplay: getComputedStyle($("panel")).display,
           cursor: cb ? [Math.round(cb.left), Math.round(cb.top), Math.round(cb.width), Math.round(cb.height)] : null, cursorBg: c ? getComputedStyle(c).backgroundColor : null };
}
function sendState() {
  post({ type: "state", name: S.name, err: S.err || null, dirty: S.dirty, undo: S.undo, panel: !!S.panel, geom: geom(), vis: S.vis ? { mode: S.vis.mode, ar: S.vis.ar, ac: S.vis.ac } : null, cur: S.cur, op: S.op, off: Math.round(S.off), top: S.top + 1, bottom: S.bottom + 1, total: total(), atEnd: S.atEnd,

         numbers: S.numbers, wrap: S.wrap, theme: document.documentElement.classList.contains("light") ? "light" : "dark",
         width: view.clientWidth, height: view.clientHeight,
         visible: Array.from(view.children).map(c => c.textContent.replace(/^\d+/, "").slice(0, 2000)).slice(0, 80) });
}
async function loadContent(keep = false) {
  const r = await fetch("/content", { cache: "no-store" }); const j = await r.json();
  S.name = j.name || ""; S.path = j.path || null; S.dirty = !!j.dirty; S.undo = j.undo || 0; S.nl = /\n$/.test(j.text || "\n");
  S.lines = j.text === "" ? [] : j.text.replace(/\r\n?/g, "\n").replace(/\n$/, "").split("\n"); cpCache.clear();
  if (j.settings) applySettings(j.settings);
  view.style.setProperty("--lnw", lnWidth()); measure.style.setProperty("--lnw", lnWidth());
  S.vis = null; setMode();
  if (keep) {                        // the text was edited: keep the place, drop the selection
    S.top = clamp(S.top, 0, Math.max(0, total() - 1)); S.off = 0;
    S.cur = { r: clamp(S.cur.r, 0, Math.max(0, total() - 1)), c: S.cur.c }; S.cur.c = clamp(S.cur.c, 0, Math.max(0, lcp(S.cur.r).length - 1));
    if (S.search) doSearch(S.search.src, S.searchBack, true); else render();
    return;
  }
  S.last = null;
  S.top = j.top ? j.top - 1 : 0; S.off = 0; S.cur = { r: S.top, c: 0 }; S.goalX = null; S.op = null; S.pend = null; setMode(); S.search = null; S.matchLines = []; S.curLine = -1; S.marks = j.marks || []; S.hls = (j.hls || []).map(h => ({ re: makeRe(h.pattern), color: h.color }));

}
function applySettings(s) {

  if (s.numbers !== undefined && s.numbers !== null && s.numbers !== S.numbers) { S.numbers = s.numbers; }
  if (s.wrap !== undefined && s.wrap !== null) S.wrap = s.wrap;
}
function onCommand(c) {
  switch (c.cmd) {
    case "load": loadContent(); break;
    case "reload": loadContent(true); break;
    case "goto": c.line ? gotoLine(c.line) : c.percent !== undefined ? gotoPercent(c.percent) : c.where === "bottom" ? gotoBottom() : gotoTop(); break;
    case "scroll": if (c.page) { c.n >= 0 ? pageDown(Math.abs(c.n) || 1) : pageUp(Math.abs(c.n)); } else if (c.n >= 0) lineDown(c.n); else lineUp(-c.n); break;
    case "search": doSearch(c.pattern, !!c.backward); break;
    case "next": stepMatch(S.searchBack ? -1 : 1); break; case "prev": stepMatch(S.searchBack ? 1 : -1); break;
    case "clear": doSearch(""); break;
    case "mark": S.marks.push({ a: c.a, b: c.b, color: c.color }); render(); break;
    case "unmark": S.marks = []; render(); break;
    case "hl": S.hls.push({ re: makeRe(c.pattern), color: c.color }); render(); break;
    case "unhl": S.hls = []; render(); break;
    case "key": for (const k of c.keys) { handleKey(k, null); } break;
    case "config": applySettings(c); render(); break;
    case "flash": flash(c.text); break;
    case "close": window.close(); break;
    case "sendstate": break;
    case "ex": runPrompt(":", c.text || ""); break;
    case "type": if (S.panel) { const f = S.panel.onCommit, t = c.text || ""; $("ptxt").value = t; if (c.commit) { closePanel(); f(t); } } else flash("no panel is open"); break;
  }
  sendState();                       // report at once: timers are throttled in a window that is not in front
}
function connect() {
  const es = new EventSource("/events");
  es.onmessage = ev => { try { onCommand(JSON.parse(ev.data)); } catch (e) { S.err = ((e && e.stack) || String(e)).slice(0, 500); console.error(e); try { sendState(); } catch (x) {} } };
  es.onopen = () => { post({ type: "hello" }); loadContent(); };
  es.onerror = () => { /* the browser reconnects by itself */ };
}
window.addEventListener("beforeunload", e => { if (S.dirty && !closedSent) { e.preventDefault(); e.returnValue = "You have unsaved changes."; return e.returnValue; } });   // closing the window with unsaved edits asks first
window.addEventListener("pagehide", () => { if (!closedSent) navigator.sendBeacon("/event", JSON.stringify({ type: "closed" })); });
connect();
</script>
